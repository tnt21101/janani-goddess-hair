  <link rel="stylesheet" href="styles.css" />
  <script src="content.js"></script>
  <script>
    (function () {
      var fallback = (window.JANANI && window.JANANI.ui.theme.default) || "light";
      var theme = fallback;
      try {
        var saved = localStorage.getItem("janani-theme");
        if (saved === "light" || saved === "dark") theme = saved;
        else if (fallback === "system") theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch (error) {}
      document.documentElement.setAttribute("data-theme", theme === "dark" ? "dark" : "light");
    })();
  </script>
</head>
